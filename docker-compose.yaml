services:
  # Banco de dados PostgreSQL para as APIs
  api_db:
    container_name: api_db
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d:ro
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  go_app_1:
    container_name: go_app_1
    build:
      context: ./go-api
      dockerfile: Dockerfile
    image: go-api
    environment:
      DB_HOST: api_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_SCHEMA_GO: go_app
      DB_PASSWORD: 1234
      DB_NAME: postgres
    ports:
      - "8081:8000"
    networks:
      - gateway-net
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  go_app_2:
    container_name: go_app_2
    build:
      context: ./go-api
      dockerfile: Dockerfile
    image: go-api
    environment:
      DB_HOST: api_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_SCHEMA_GO: go_app
      DB_PASSWORD: 1234
      DB_NAME: postgres
    ports:
      - "8082:8000"
    networks:
      - gateway-net
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  python_app_1:
    container_name: python_app_1
    build:
      context: ./python-api
      dockerfile: Dockerfile
    image: python-api
    environment:
      DB_HOST: api_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_SCHEMA_PYTHON: python_app
      DB_PASSWORD: 1234
      DB_NAME: postgres
    ports:
      - "8083:8000"
    networks:
      - gateway-net
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  python_app_2:
    container_name: python_app_2
    build:
      context: ./python-api
      dockerfile: Dockerfile
    image: python-api
    environment:
      DB_HOST: api_db
      DB_PORT: 5432
      DB_USER: postgres
      DB_SCHEMA_PYTHON: python_app
      DB_PASSWORD: 1234
      DB_NAME: postgres
    ports:
      - "8084:8000"
    networks:
      - gateway-net
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  node_app_1:
    container_name: node_api_1
    build:
      context: ./node-api
      dockerfile: Dockerfile
    image: node-api
    environment:
      - DB_HOST=api_db
      - DB_PORT=5432
      - DB_USER=postgres        
      - DB_PASSWORD=1234     
      - DB_NAME=postgres         
      - DB_SCHEMA_NODE=node_app               
    ports:
      - "8085:8000"              
    networks:
      - gateway-net              
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  node_app_2:
    container_name: node_api_2
    build:
      context: ./node-api
      dockerfile: Dockerfile
    image: node-api
    environment:
      - DB_HOST=api_db
      - DB_PORT=5432
      - DB_USER=postgres        
      - DB_PASSWORD=1234     
      - DB_NAME=postgres         
      - DB_SCHEMA_NODE=node_app               
    ports:
      - "8086:8000"              
    networks:
      - gateway-net              
    depends_on:
      api_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  rust_gateway:
    container_name: rust_gateway
    build:
      context: ./rust-gateway
      dockerfile: Dockerfile
    image: rust-gateway
    environment:
      - UPSTREAMS=http://go_app_1:8000,http://go_app_2:8000,http://python_app_1:8000,http://python_app_2:8000,http://node_app_1:8000,http://node_app_2:8000
      - RATE_LIMIT=30
      - WINDOW_SEC=60
      - CB_FAIL_THRESHOLD=3
      - CB_COOLDOWN_SEC=10
      - PORT=8000
    ports:
      - "8080:8000"
    networks:
      - gateway-net
    depends_on:
      - go_app_1
      - go_app_2
      - python_app_1
      - python_app_2
      - node_app_1
      - node_app_2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/_health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  gateway-net:
    driver: bridge

volumes:
  pgdata: {}