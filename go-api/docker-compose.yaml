services:
  go_db:
    container_name: go_db
    image: postgres:12
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
  go_app:
    container_name: go_app
    build: .
    image: go-api-tutorial
    environment:
      DATABASE_URL: postgresql://postgres:postgres@go_db:5432/go_db
    ports:
      - "8000:8000"
    depends_on:
      go_db:
        condition: service_healthy


volumes:
  pgdata: {}
